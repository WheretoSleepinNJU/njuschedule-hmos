name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  OHOS_CLI_VERSION: '26.0.0.821'

jobs:
  release:
    name: Build unsigned HAP and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev jq

      - name: Setup HarmonyOS CLI
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.OHOS_CLI_VERSION }}
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure SDK environment
        run: echo "DEVECO_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"

      - name: Run repository tests
        run: node --test test/*.test.cjs

      - name: Install ohpm dependencies
        run: ohpm install --all

      - name: Build release HAP (unsigned)
        run: hvigorw assembleHap --mode module -p product=default -p module=entry@default -p buildMode=release --no-daemon

      - name: Static check
        run: codelinter -c code-linter.json5 entry/src/main/ets -e error

      - name: Prepare release files
        run: |
          VERSION=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('AppScope/app.json5','utf8')).app.versionName)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp entry/build/default/outputs/default/entry-default-unsigned.hap "njuschedule-hmos-${VERSION}-unsigned.hap"
          sha256sum "njuschedule-hmos-${VERSION}-unsigned.hap" > SHA256SUMS
          node scripts/release-notes.cjs "$VERSION" > release-notes.md
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 呢喃课表 ${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            njuschedule-hmos-*-unsigned.hap
            SHA256SUMS
          draft: false
          prerelease: false
