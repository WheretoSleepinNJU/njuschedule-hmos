name: 功能建议
description: 提出新功能、交互或体验改进建议
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请确认：

        - 建议与南京大学课程表 / 本应用的实际使用场景相关；
        - 已搜索 [Issues](https://github.com/WheretoSleepinNJU/njuschedule-hmos/issues)，没有重复建议；
        - 已阅读 [CONTRIBUTING.md](https://github.com/WheretoSleepinNJU/njuschedule-hmos/blob/main/CONTRIBUTING.md)。

        新功能需要先讨论是否适合项目，不一定会被接受。

  - type: dropdown
    id: area
    attributes:
      label: 建议模块
      options:
        - 课表
        - 课程
        - 教务导入
        - 分享 / 导入码
        - 讲座
        - 桌面小组件
        - 设置 / 外观
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在的哪个场景不方便？你希望改善什么？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望它如何工作？请尽量描述交互流程、边界情况和设备差异（手机 / 平板 / PC）。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或参考
      description: 可参考的同类应用、HarmonyOS 官方能力或已有实现；有截图更好。

  - type: textarea
    id: scope
    attributes:
      label: 影响范围（可选）
      description: 是否涉及新权限、第三方依赖、数据 schema、导入域名或隐私政策变更？如有请说明。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过 Issues，没有发现重复建议。
          required: true
        - label: 我理解新功能需要讨论，不一定会被接受。
          required: true
        - label: 我已确认这不是现有版本已经具备的功能。
          required: true
